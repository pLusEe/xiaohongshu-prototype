<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>小红书社区互动 Demo</title>
  <script>
    // Select the initial surface before deferred app scripts or image decoding.
    (() => {
      const [page, id] = location.hash.slice(2).split("/");
      const dark = ["profile", "author", "video"].includes(page);
      document.documentElement.dataset.statusTheme = dark ? "white" : page === "note" && !["kai", "crab"].includes(id) ? "detail" : "dark";
      if (dark) document.documentElement.dataset.initialSurface = page === "profile" && id === "lin" ? "own" : "dark";
      if (page === "profile" && id === "lin") {
        const preload = document.createElement("link");
        preload.rel = "preload"; preload.as = "image";
        preload.href = "assets/community/daily-8.jpg";
        document.head.appendChild(preload);
      }
    })();
  </script>
  <link rel="preload" as="image" href="assets/ios/status-white.png">
  <link rel="preload" as="image" href="assets/ios/status-dark.png">
  <link rel="preload" as="image" href="assets/ios/status-detail.png">
  <link rel="preload" as="image" href="assets/ios/like-small.png">
  <link rel="preload" as="image" href="assets/ios/like.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="ios.css">
  <link rel="stylesheet" href="community.css">
  <link rel="stylesheet" href="supplement.css">
  <link rel="stylesheet" href="share.css">
  <link rel="stylesheet" href="search.css">
  <link rel="stylesheet" href="social.css">
  <script src="data.js" defer></script>
  <script src="ios-data.js" defer></script>
  <script src="community-data.js" defer></script>
  <script src="supplement-data.js" defer></script>
  <script src="community-expansion-data.js" defer></script>
  <script src="community-ui.js" defer></script>
  <script src="supplement-ui.js" defer></script>
  <script src="social-ui.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="preview-stage">
    <div id="device-holder">
      <section id="device" aria-label="小红书应用原型">
        <div class="status-bar" aria-hidden="true"><img class="status-light" src="assets/ios/status-dark.png" alt=""><img class="status-on-dark" src="assets/ios/status-white.png" alt=""><img class="status-detail" src="assets/ios/status-detail.png" alt=""></div>
        <div id="app"></div>
        <div class="system-gesture" aria-hidden="true"><span></span></div>
        <div id="overlay-root"></div>
        <div id="social-snackbar" role="status" aria-live="polite" hidden></div>
        <div id="toast" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>
</body>
</html>
